[package]
name = "opal"
version = "0.1.0"
edition = "2024"
description = "Opal, a Rust rewrite of Lumen: glass widgets (launcher, clock, notes, calendar, music) that live on the Windows wallpaper."
license = "MIT"

[[bin]]
name = "opal"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.21"
rfd = "0.15"
ureq = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
